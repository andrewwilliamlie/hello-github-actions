name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FIELD_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc= # CI-only test key
  BLIND_INDEX_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=     # CI-only test key
  OTP_PEPPER: ci-only-pepper-0123456789
  DATABASE_URL: postgresql://hausjo:hausjo@localhost:5432/hausjo?schema=public
  TEST_DATABASE_URL: postgresql://hausjo:hausjo@localhost:5432/hausjo_test?schema=public

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hausjo, POSTGRES_PASSWORD: hausjo, POSTGRES_DB: hausjo_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hausjo" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hausjo, POSTGRES_PASSWORD: hausjo, POSTGRES_DB: hausjo }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hausjo" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo export --platform android --platform ios --output-dir dist
